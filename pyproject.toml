[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-image-selector"
version = "1.2.0"
description = "Stereo image, depth and point-cloud inspection workbench"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.3,<12",
  "plyfile>=1.0.3,<2",
  "PyOpenGL>=3.1.7,<4",
  "pyqtgraph>=0.13.7,<0.15",
  "PySide6>=6.7,<7",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.8,<7"]
test = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
stereo-selector = "stereo_selector.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stereo_selector = ["assets/*.png", "assets/*.svg", "assets/calibration/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests", "scripts"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PIE", "RUF100"]
ignore = [
  "E501",  # long lines are wrapped by hand where it matters
  "B008",  # Qt widget defaults in signatures are intentional
  "B905",  # zip strict= is not needed for the fixed-length pairs used here
  "UP007",  # keep Optional/Union readable in stubs targeting 3.10
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841", "B011", "B017", "B018"]
"scripts/*" = ["E402"]
"src/stereo_selector/media/__init__.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["stereo_selector"]
