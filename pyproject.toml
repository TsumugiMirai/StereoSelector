[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-image-selector"
version = "1.0.0"
description = "Codex and VS Code inspired stereo image and point-cloud review tool"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10.3,<12",
  "plyfile>=1.0.3,<2",
  "PyOpenGL>=3.1.7,<4",
  "pyqtgraph>=0.13.7,<0.15",
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.8,<7"]
test = ["pytest>=8,<9"]

[project.scripts]
stereo-selector = "stereo_selector.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stereo_selector = ["assets/*.png", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
